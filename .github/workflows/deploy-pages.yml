name: Deploy Pages

# This workflow no longer syncs and holds no Drive credentials. It builds and
# deploys whatever archive data is committed. Refreshing that data is the
# 'Sync archive from Drive' workflow, and merging its pull request lands here.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the committed archive is present
        run: |
          set -euo pipefail
          for path in src/generated/catalog.json public/data/search-index.json; do
            if [ ! -s "$path" ]; then
              echo "Missing $path. Run the 'Sync archive from Drive' workflow and merge its" >&2
              echo "pull request; this workflow builds from committed data and never syncs." >&2
              exit 1
            fi
          done
          # The catalog can be perfectly valid while every thumbnail, transcode and viewer
          # image is absent, and that deploys clean with broken media on every release page.
          # -s is no help on a directory, which has a non-zero size while empty, so this asks
          # for one entry and stops: no walk of the ~2,849 files that should be in there.
          if [ -z "$(find public/generated/derivatives -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            echo "public/generated/derivatives/ is missing or empty. Run the 'Sync archive" >&2
            echo "from Drive' workflow and merge its pull request; this workflow builds from" >&2
            echo "committed data and never syncs." >&2
            exit 1
          fi
      - name: Run unit tests
        run: npm test
      - name: Configure GitHub Pages
        # Runs before the build because the build needs its outputs. `origin` and `base_path`
        # are resolved from the repository's live Pages settings, so they follow a custom
        # domain: this site answers on https://yonatankarp.com/guillotine-archive/, while
        # https://<owner>.github.io/<repo>/ only 301s there. Deriving them means the canonical
        # and og:url tags name the URL that actually serves the page, and keep doing so
        # through a repository rename or a domain change.
        if: success()
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build production site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Run browser tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_DIST: '1'
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload curator report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: curator-report
          path: reports/curator-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deployment:
    if: success() && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
